// Build for Minecraft 26.x. From 26.1 on Minecraft is not obfuscated, so this uses Mojang's
// names directly. Shared code is in ../common; the 1.21.11 build is in the repo root.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+26.x"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java.srcDirs += '../common/src/main/java'
        resources.srcDirs += '../common/src/main/resources'
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("../LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
